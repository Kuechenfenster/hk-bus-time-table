name: Marketplace validation

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Since HA 2026.11 this validates against the built-in Marketplace's
      # catalog requirements (it reads hacs.json); hacs/action remains the
      # official checker for custom repositories.
      - name: Marketplace repository rules
        uses: hacs/action@main
        with:
          category: integration
